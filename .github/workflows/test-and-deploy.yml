name: Test & Deploy

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  vercel-check:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: rice-sorter-tests
